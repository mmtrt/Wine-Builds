name: Bootstraps CI

on:
  schedule:
    - cron:  0 0 */5 * *
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture(s) to build'
        required: true
        default: x86_64
        type: choice
        options:
          - x86_64
          - aarch64

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            target_arch: x86_64
            artifact_name: Bootstraps
            tarball: bootstraps.tar.xz
          - arch: aarch64
            runner: ubuntu-22.04-arm
            target_arch: aarch64
            artifact_name: Bootstraps-ARM64
            tarball: bootstraps-arm64.tar.xz
    runs-on: ${{ matrix.runner }}
    # Allow selecting a single arch via workflow_dispatch
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.arch == matrix.arch

    steps:
      - uses: actions/checkout@v4

      - name: Create bootstraps (${{ matrix.arch }})
        run: |
          sudo apt update
          sudo apt install -y debootstrap perl
          chmod +x create_ubuntu_bootstraps.sh
          export TARGET_ARCH="${{ matrix.target_arch }}"
          sudo -E ./create_ubuntu_bootstraps.sh
          cd /opt
          sudo tar -I "xz -T0 -9" -cpf "${{ matrix.tarball }}" chroots
          sha256sum "${{ matrix.tarball }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: /opt/${{ matrix.tarball }}
