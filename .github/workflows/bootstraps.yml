name: Bootstraps CI

on:
  schedule:
    - cron:  0 0 */5 * *
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture(s) to build'
        required: true
        default: all
        type: choice
        options:
          - all
          - x86_64
          - aarch64

jobs:
  matrix:
    runs-on: ubuntu-22.04
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - id: set
        run: |
          ALL='[{"arch":"x86_64","runner":"ubuntu-22.04","target_arch":"x86_64","artifact_name":"Bootstraps","tarball":"bootstraps.tar.xz"},{"arch":"aarch64","runner":"ubuntu-22.04-arm","target_arch":"aarch64","artifact_name":"Bootstraps-ARM64","tarball":"bootstraps-arm64.tar.xz"}]'
          X64='[{"arch":"x86_64","runner":"ubuntu-22.04","target_arch":"x86_64","artifact_name":"Bootstraps","tarball":"bootstraps.tar.xz"}]'
          ARM='[{"arch":"aarch64","runner":"ubuntu-22.04-arm","target_arch":"aarch64","artifact_name":"Bootstraps-ARM64","tarball":"bootstraps-arm64.tar.xz"}]'
          SELECT="${{ github.event.inputs.arch }}"
          if [ "$SELECT" = "x86_64" ]; then
            echo "include=$X64" >> "$GITHUB_OUTPUT"
          elif [ "$SELECT" = "aarch64" ]; then
            echo "include=$ARM" >> "$GITHUB_OUTPUT"
          else
            echo "include=$ALL" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Create bootstraps (${{ matrix.arch }})
        run: |
          sudo apt update
          sudo apt install -y debootstrap perl
          chmod +x create_ubuntu_bootstraps.sh
          export TARGET_ARCH="${{ matrix.target_arch }}"
          sudo -E ./create_ubuntu_bootstraps.sh
          cd /opt
          sudo tar -I "xz -T0 -9" -cpf "${{ matrix.tarball }}" chroots
          sha256sum "${{ matrix.tarball }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: /opt/${{ matrix.tarball }}
