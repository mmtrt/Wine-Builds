name: Wine-latest CI

on:
  schedule:
    - cron:  '0 0 */6 * *'
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture(s) to build'
        required: true
        default: x86_64
        type: choice
        options:
          - x86_64
          - aarch64

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            target_arch: x86_64
            bootstrap_workflow: bootstraps.yml
            bootstrap_artifact: Bootstraps
            bootstrap_tarball: bootstraps.tar.xz
            mingw_path: ""
            artifact_name: Wine-latest
            release_tag: latest
            release_title: wine-builds latest
          - arch: aarch64
            runner: ubuntu-22.04-arm
            target_arch: aarch64
            bootstrap_workflow: bootstraps.yml
            bootstrap_artifact: Bootstraps-ARM64
            bootstrap_tarball: bootstraps-arm64.tar.xz
            mingw_path: /opt/chroots/bionicarm64_chroot/opt/mingw/aarch64/bin
            artifact_name: Wine-latest-ARM64
            release_tag: latest-arm64
            release_title: wine-builds latest arm64
    runs-on: ${{ matrix.runner }}
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.arch == matrix.arch

    steps:
      - uses: actions/checkout@v4

      - name: Download bootstrap artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ${{ matrix.bootstrap_workflow }}
          workflow_conclusion: success
          name: ${{ matrix.bootstrap_artifact }}
          path: /opt

      - name: Build Wine (${{ matrix.arch }})
        run: |
          sudo apt update
          sudo apt install -y \
            binutils-mingw-w64-i686 \
            binutils-mingw-w64-x86-64 \
            debootstrap perl git wget xz-utils bubblewrap autoconf
          sudo tar -C /opt -xpf "/opt/${{ matrix.bootstrap_artifact }}/${{ matrix.bootstrap_tarball }}" 2>/dev/null \
            || sudo tar -C /opt -xpf "/opt/${{ matrix.bootstrap_tarball }}"
          if [ -n "${{ matrix.mingw_path }}" ]; then
            export PATH="${{ matrix.mingw_path }}:${PATH}"
          fi
          chmod +x build_wine.sh
          export TARGET_ARCH="${{ matrix.target_arch }}"
          export WINE_VERSION="latest"
          export EXPERIMENTAL_WOW64="true"
          WINE_BRANCH=vanilla ./build_wine.sh
          WINE_BRANCH=staging ./build_wine.sh
          sha256sum *.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./*.tar.xz

      - name: Build release
        uses: marvinpinto/action-automatic-releases@6273874b61ebc8c71f1a61b2d98e234cf389b303
        with:
          title: ${{ matrix.release_title }}
          automatic_release_tag: ${{ matrix.release_tag }}
          prerelease: false
          draft: false
          files: ./*.tar.xz
          repo_token: ${{ secrets.GITHUB_TOKEN }}
