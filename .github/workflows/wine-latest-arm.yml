name: Wine-latest ARM64 CI

on:
  schedule:
    - cron:  '0 0 */6 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        id: download-artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: bootstraps-arm.yml
          workflow_conclusion: success
          path: /opt
      - name: Build Wine
        run: |
          sudo apt update
          # PC wine-latest installs: binutils-mingw-w64-i686 binutils-mingw-w64-x86-64
          # Ubuntu has no binutils-mingw-w64-aarch64 / arm64ec packages; aarch64 PE
          # toolchain comes from the bootstrap (/opt/mingw/aarch64). Install the
          # same base tools that exist on all arches, plus build deps.
          sudo apt install -y \
            binutils-mingw-w64-i686 \
            binutils-mingw-w64-x86-64 \
            debootstrap perl git wget xz-utils bubblewrap autoconf
          sudo tar -C /opt -xpf /opt/Bootstraps-ARM64/bootstraps-arm64.tar.xz
          # Expose bootstrap aarch64 MinGW (strip, etc.) like host mingw on PC
          export PATH="/opt/chroots/bionicarm64_chroot/opt/mingw/aarch64/bin:${PATH}"
          chmod +x build_wine.sh
          export TARGET_ARCH=aarch64
          export WINE_VERSION="latest"
          export EXPERIMENTAL_WOW64="true"
          WINE_BRANCH=vanilla ./build_wine.sh
          WINE_BRANCH=staging ./build_wine.sh
          sha256sum *.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: Wine-latest-ARM64
          path: ./*.tar.xz

      - name: Build release
        uses: marvinpinto/action-automatic-releases@6273874b61ebc8c71f1a61b2d98e234cf389b303
        with:
          title: wine-builds latest arm64
          automatic_release_tag: latest-arm64
          prerelease: false
          draft: false
          files: ./*.tar.xz
          repo_token: ${{ secrets.GITHUB_TOKEN }}
