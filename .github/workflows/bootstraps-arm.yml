name: Bootstraps ARM64 CI

on:
  schedule:
    - cron:  0 0 */5 * *
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Create arm64 bootstraps
        run: |
          sudo apt update
          sudo apt install debootstrap perl
          chmod +x create_ubuntu_bootstraps.sh
          export TARGET_ARCH=aarch64
          sudo -E ./create_ubuntu_bootstraps.sh
          cd /opt
          sudo tar -I "xz -T0 -9" -cpf bootstraps-arm64.tar.xz chroots
          sha256sum *.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: Bootstraps-ARM64
          path: /opt/bootstraps-arm64.tar.xz
